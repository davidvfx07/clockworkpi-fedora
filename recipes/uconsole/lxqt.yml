name: cf-uconsole-lxqt

description: An unofficial Fedora LXQT image for the ClockworkPi uConsole CM4

base-image: quay.io/fedora/fedora-iot
image-version: 43-aarch64

modules:
  - from-file: uconsole/common/extra.yml

  - type: dnf
    group-install:   
      packages:
        - lxqt-desktop

  - type: os-release
    properties:
      NAME: ClockworkPi Fedora - uConsole (LXQT)
      PRETTY_NAME: ClockworkPi Fedora 43 (Forty Three) - uConsole (LXQT)

  - type: signing
