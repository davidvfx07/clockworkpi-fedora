name: cf-uconsole-base

description: An unofficial Fedora base image for the ClockworkPi uConsole CM4

base-image: quay.io/fedora/fedora-iot
image-version: 43-aarch64

modules:
  - from-file: uconsole/common/base.yml

  - type: os-release
    properties:
      NAME: ClockworkPi Fedora - uConsole (Base)
      PRETTY_NAME: ClockworkPi Fedora 43 (Forty Three) - uConsole (Base)

  - type: signing
